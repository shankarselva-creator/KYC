version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: habit-tracker-app
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - .:/var/www
    environment:
      - APP_ENV=local
    depends_on:
      - mysql
    networks:
      - habit-network

  webserver:
    image: nginx:alpine
    container_name: habit-tracker-nginx
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - .:/var/www
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app
    networks:
      - habit-network

  mysql:
    image: mysql:8.0
    container_name: habit-tracker-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: habit_tracker
      MYSQL_ROOT_PASSWORD: secret
      MYSQL_USER: habit_user
      MYSQL_PASSWORD: habit_pass
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - habit-network

networks:
  habit-network:
    driver: bridge

volumes:
  mysql_data:
